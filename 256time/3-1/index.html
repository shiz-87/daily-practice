<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Watch by 256timesの価値観</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="values">
      <h2 class="values__title">The Watch by 256timesの価値観</h2>
      <ul class="values__list">
        <li class="values__item values-item">
          <div class="values-item__image">
            <img
              src="https://256times-upload-files.s3.ap-northeast-1.amazonaws.com/production/370239/5977/13cef392e81e128f8cc20447c8ec20792df4d01c.png"
              alt="ソファの上に置かれ、窓から差し込む陽をうけるアナログ時計"
              width="400"
              height="266"
            />
          </div>
          <h3 class="values-item__title">新しいクラシック</h3>
          <p class="values-item__text">
            現代に必要なのは、ただの時計ではない。それは、たった一瞬で美意識と品格を語る、静かなる主張。それは「目立つ」のではなく、「際立つ」ためのデザイン。
          </p>
        </li>
        <li class="values__item values-item">
          <div class="values-item__image">
            <img
              src="https://256times-upload-files.s3.ap-northeast-1.amazonaws.com/production/370239/5976/e36cd0e101ea538ca669d3cf34927f424206d010.png"
              alt="黒の長袖シャツを着て、丸いアナログ時計を身につけた男性"
              width="400"
              height="266"
            />
          </div>
          <h3 class="values-item__title">時を超えて受け継がれるもの</h3>
          <p class="values-item__text">
            流行は移ろう。しかし、本物は変わらない。受け継がれてきた物には、語り継がれる物語がある。今を超えていく、価値がここにある。
          </p>
        </li>
        <li class="values__item values-item">
          <div class="values-item__image">
            <img
              src="https://256times-upload-files.s3.ap-northeast-1.amazonaws.com/production/370239/5978/53d0494a6ac417ebc0ca1893ecaa5dbccedbe3a5.png"
              alt="金と銀の丸いアナログ時計を身につけたスーツの男性の腕"
              width="400"
              height="266"
            />
          </div>
          <h3 class="values-item__title">精密を極めた美学</h3>
          <p class="values-item__text">
            秒単位の誤差さえ許さない、職人たちの執念。ビジネスも、人生も、一瞬の判断がすべてを変える。だからこそ、選ぶべきは「正確さ」と「信頼」を身に宿した一本。
          </p>
        </li>
      </ul>
    </section>
  </body>
</html>
